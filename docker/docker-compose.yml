services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fileanalysis
      POSTGRES_USER: fa
      POSTGRES_PASSWORD: fa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
